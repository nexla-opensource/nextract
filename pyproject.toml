[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextract"
version = "0.2.0b4"
description = "Structured extraction framework over Pydantic AI Agent with JSON Schema & Pydantic model outputs."
readme = "README.md"
authors = [
    {name = "Saksham Mittal", email = "saksham.mittal@nexla.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai,anthropic,google,vertexai,cohere,bedrock]>=1.0.0",
    "jsonschema>=4.19",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "tenacity>=8.2.3",
    "rich>=13.7",
    "PyMuPDF>=1.23.0",
    "tiktoken>=0.5.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "pillow>=10.0.0",
    # rag_chunking subpackage (Gemini-backed multi-format RAG chunker)
    "google-genai>=1.0.0",
    "pdfplumber>=0.11.0",
    # pandas <3.0 required: rag_chunking's merge step uses a groupby().apply()
    # pattern whose grouping-column handling changed in pandas 3 (drops the
    # page_number column -> KeyError on every PDF). Modernization tracked.
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    # NOTE: rag_chunking opportunistically imports json_repair (inside
    # try/except) for its strongest JSON-repair path and falls back to an
    # in-package repairer when absent. Deliberately NOT declared: installing
    # it changes which repair path runs, and parity goldens were captured
    # without it. Revisit alongside the JSON-handling consolidation.
]

[project.optional-dependencies]
dev = [
    "mypy>=1.7",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-asyncio>=0.21.0",
    # Pinned minor: ruff 0.16 expanded its default rule set and flags existing
    # modules; bump deliberately together with a lint-cleanup pass.
    "ruff>=0.15,<0.16",
]

[project.scripts]
nextract = "nextract.cli:app"

## setuptools_scm is no longer used; static version above

[tool.setuptools.packages.find]
include = ["nextract*"]

[tool.setuptools.package-data]
# Ship the provenance record every rag_chunking module header points at.
"nextract.rag_chunking" = ["PROVENANCE.md"]

[tool.setuptools.exclude-package-data]
nextract = [".env*"]

[tool.ruff.lint.per-file-ignores]
# rag_chunking core modules are ported byte-verbatim from the production
# monolith (see nextract/rag_chunking/PROVENANCE.md); style-only findings in
# those bodies are suppressed rather than editing provenance-tracked code.
# Minimal set (only rules those bodies actually trip); the facade
# (__init__.py) and tests are NOT exempt.
"nextract/rag_chunking/chunker_utils.py" = ["F841"]
"nextract/rag_chunking/pipeline.py" = ["E401", "F541", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
